<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CAPITAN FC | Official</title>

<style>
:root{
  --bg:#07090f;
  --card:#10141e;
  --card2:#151b28;
  --gold:#e7b84b;
  --text:#f5f5f5;
  --muted:#9da5b5;
  --border:#252d3c;
}

*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

html{
  scroll-behavior:smooth;
}

body{
  font-family:Arial,Tahoma,sans-serif;
  background:
    radial-gradient(circle at 10% 10%,#17255455,transparent 30%),
    radial-gradient(circle at 90% 90%,#581c8750,transparent 30%),
    var(--bg);
  color:var(--text);
  min-height:100vh;
  overflow-x:hidden;
}

body:before,
body:after{
  content:"";
  position:fixed;
  width:400px;
  height:400px;
  border-radius:50%;
  filter:blur(100px);
  opacity:.12;
  pointer-events:none;
  z-index:-1;
}

body:before{
  background:#2563eb;
  top:-100px;
  left:-100px;
}

body:after{
  background:#9333ea;
  right:-100px;
  bottom:-100px;
}

a{
  color:inherit;
  text-decoration:none;
}

.container{
  width:min(1150px,92%);
  margin:auto;
}

header{
  position:sticky;
  top:0;
  z-index:100;
  background:#07090fee;
  backdrop-filter:blur(18px);
  border-bottom:1px solid #ffffff0d;
}

.header-inner{
  min-height:72px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:20px;
}

.logo{
  width:48px;
  height:48px;
  border-radius:15px;
  display:flex;
  align-items:center;
  justify-content:center;
  background:linear-gradient(135deg,#151922,#252c39);
  border:1px solid #e7b84b55;
  color:var(--gold);
  font-weight:900;
  font-size:25px;
  box-shadow:0 0 25px #e7b84b22;
}

.brand{
  display:flex;
  align-items:center;
  gap:12px;
}

.brand-text strong{
  display:block;
  font-size:16px;
}

.brand-text span{
  display:block;
  color:var(--muted);
  font-size:11px;
  margin-top:3px;
}

nav{
  display:flex;
  gap:18px;
  color:#c5cad4;
  font-size:13px;
}

nav a{
  transition:.25s;
}

nav a:hover{
  color:var(--gold);
}

.hero{
  padding:80px 0 50px;
}

.hero-grid{
  display:grid;
  grid-template-columns:1.3fr .7fr;
  gap:25px;
  align-items:stretch;
}

.hero-content{
  padding:50px 0;
}

.tag{
  display:inline-block;
  color:var(--gold);
  border:1px solid #e7b84b44;
  background:#e7b84b0d;
  padding:7px 12px;
  border-radius:999px;
  font-size:11px;
  margin-bottom:18px;
}

.hero h1{
  font-size:clamp(38px,6vw,72px);
  line-height:1.1;
  margin-bottom:20px;
}

.hero h1 span{
  color:var(--gold);
}

.hero p{
  color:var(--muted);
  line-height:2;
  max-width:650px;
}

.buttons{
  display:flex;
  gap:12px;
  margin-top:25px;
  flex-wrap:wrap;
}

.btn{
  padding:12px 20px;
  border-radius:12px;
  border:1px solid var(--border);
  background:var(--card);
  cursor:pointer;
  display:inline-flex;
  align-items:center;
  justify-content:center;
  transition:.25s;
}

.btn.primary{
  background:var(--gold);
  color:#111;
  border-color:var(--gold);
  font-weight:bold;
}

.btn:hover{
  transform:translateY(-2px);
}

.hero-card{
  background:linear-gradient(145deg,#111722,#0b0e16);
  border:1px solid var(--border);
  border-radius:25px;
  min-height:330px;
  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;
  text-align:center;
  padding:30px;
  box-shadow:0 20px 70px #0008;
}

.big-logo{
  width:130px;
  height:130px;
  border-radius:38px;
  border:2px solid #e7b84b66;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:70px;
  font-weight:900;
  color:var(--gold);
  box-shadow:0 0 50px #e7b84b18;
  margin-bottom:20px;
}

.hero-card h2{
  margin-bottom:8px;
}

.hero-card p{
  color:var(--muted);
  font-size:13px;
}

section{
  padding:65px 0;
}

.section-title{
  display:flex;
  align-items:end;
  justify-content:space-between;
  margin-bottom:25px;
  gap:15px;
}

.section-title h2{
  font-size:28px;
}

.section-title p{
  color:var(--muted);
  font-size:12px;
}

.news{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:18px;
}

.card{
  background:linear-gradient(145deg,#111722,#0c1018);
  border:1px solid var(--border);
  border-radius:18px;
  padding:22px;
  transition:.25s;
}

.card:hover{
  transform:translateY(-4px);
  border-color:#e7b84b55;
  box-shadow:0 15px 40px #0005;
}

.card h3{
  margin:12px 0;
  line-height:1.6;
}

.card p{
  color:var(--muted);
  line-height:1.9;
  font-size:13px;
}

.news-date{
  color:#747d8d;
  font-size:11px;
  margin-top:15px;
}

.loading{
  grid-column:1/-1;
  text-align:center;
  padding:40px;
  color:var(--muted);
}

.error-box{
  grid-column:1/-1;
  text-align:center;
  padding:35px;
  border:1px solid #7f1d1d;
  border-radius:18px;
  background:#450a0a44;
  color:#fca5a5;
}
