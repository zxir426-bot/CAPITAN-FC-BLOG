<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>CAPITAN FC | Official Website</title>

<style>

:root{
    --bg:#07090f;
    --card:#10141e;
    --card2:#151b28;
    --gold:#e7b84b;
    --text:#f5f5f5;
    --muted:#9da5b5;
    --border:#252d3c;
}

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html{
    scroll-behavior:smooth;
}

body{
    font-family:Arial,Tahoma,sans-serif;
    background:
        radial-gradient(circle at 10% 10%,#17255455,transparent 30%),
        radial-gradient(circle at 90% 90%,#581c8750,transparent 30%),
        var(--bg);
    color:var(--text);
    min-height:100vh;
    overflow-x:hidden;
}

a{
    color:inherit;
    text-decoration:none;
}

.container{
    width:92%;
    max-width:1150px;
    margin:auto;
}


/* HEADER */

header{
    position:sticky;
    top:0;
    z-index:1000;
    background:#07090fee;
    backdrop-filter:blur(15px);
    border-bottom:1px solid #ffffff12;
}

.header-inner{
    min-height:72px;
    display:flex;
    align-items:center;
    justify-content:space-between;
}

.brand{
    display:flex;
    align-items:center;
    gap:12px;
}

.logo{
    width:48px;
    height:48px;
    border-radius:15px;
    display:flex;
    align-items:center;
    justify-content:center;
    background:#121722;
    border:1px solid #e7b84b66;
    color:var(--gold);
    font-size:25px;
    font-weight:900;
    box-shadow:0 0 25px #e7b84b22;
}

.brand-text strong{
    display:block;
    font-size:16px;
}

.brand-text span{
    display:block;
    color:var(--muted);
    font-size:10px;
    margin-top:4px;
}

nav{
    display:flex;
    gap:18px;
    font-size:13px;
    color:#c7ccd5;
}

nav a{
    transition:.25s;
}

nav a:hover{
    color:var(--gold);
}


/* HERO */

.hero{
    padding:80px 0 50px;
}

.hero-grid{
    display:grid;
    grid-template-columns:1.3fr .7fr;
    gap:30px;
    align-items:center;
}

.hero-content{
    padding:20px 0;
}

.tag{
    display:inline-block;
    color:var(--gold);
    background:#e7b84b0d;
    border:1px solid #e7b84b44;
    padding:7px 12px;
    border-radius:999px;
    font-size:11px;
    margin-bottom:18px;
}

.hero h1{
    font-size:clamp(40px,6vw,72px);
    line-height:1.1;
    margin-bottom:20px;
}

.hero h1 span{
    color:var(--gold);
}

.hero p{
    color:var(--muted);
    line-height:2;
    max-width:650px;
}

.buttons{
    display:flex;
    gap:12px;
    margin-top:25px;
    flex-wrap:wrap;
}

.btn{
    padding:12px 20px;
    border-radius:12px;
    border:1px solid var(--border);
    background:var(--card);
    display:inline-flex;
    align-items:center;
    justify-content:center;
    transition:.25s;
}

.btn:hover{
    transform:translateY(-2px);
}

.btn.primary{
    background:var(--gold);
    color:#111;
    border-color:var(--gold);
    font-weight:bold;
}


/* HERO CARD */

.hero-card{
    min-height:340px;
    background:linear-gradient(145deg,#111722,#0b0e16);
    border:1px solid var(--border);
    border-radius:25px;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    text-align:center;
    padding:30px;
    box-shadow:0 20px 70px #0008;
}

.big-logo{
    width:135px;
    height:135px;
    border-radius:38px;
    border:2px solid #e7b84b66;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:75px;
    font-weight:900;
    color:var(--gold);
    box-shadow:0 0 50px #e7b84b22;
    margin-bottom:20px;
}

.hero-card h2{
    margin-bottom:8px;
}

.hero-card p{
    color:var(--muted);
    font-size:12px;
}


/* SECTIONS */

section{
    padding:65px 0;
}

.section-title{
    margin-bottom:25px;
}

.section-title h2{
    font-size:28px;
}

.section-title p{
    color:var(--muted);
    font-size:12px;
    margin-top:6px;
}


/* CARDS */

.card{
    background:linear-gradient(145deg,#111722,#0c1018);
    border:1px solid var(--border);
    border-radius:18px;
    padding:22px;
    transition:.25s;
}

.card:hover{
    transform:translateY(-4px);
    border-color:#e7b84b55;
    box-shadow:0 15px 40px #0005;
}

.card h3{
    margin:10px 0;
    line-height:1.6;
}

.card p{
    color:var(--muted);
    line-height:1.9;
    font-size:13px;
}


/* NEWS */

.news{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:18px;
}

.loading{
    grid-column:1/-1;
    text-align:center;
    padding:40px;
    color:var(--muted);
}


/* GRID */

.grid{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:18px;
}


/* PLAYERS */

.player{
    text-align:center;
}

.player-number{
    font-size:38px;
    font-weight:900;
    color:var(--gold);
}

.player p{
    color:var(--muted);
}


/* MATCH */

.match{
    text-align:center;
}

.match-teams{
    display:flex;
    align-items:center;
    justify-content:center;
    gap:20px;
}

.team-name{
    font-weight:bold;
    font-size:17px;
}

.score{
    color:var(--gold);
    font-size:25px;
    font-weight:900;
}


/* TROPHIES */

.trophy{
    text-align:center;
}

.trophy-icon{
    font-size:45px;
    margin-bottom:10px;
}


/* MEDIA */

.media{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:15px;
}

.media-item{
    min-height:150px;
    border-radius:18px;
    border:1px solid var(--border);
    background:linear-gradient(145deg,#151b28,#0d1119);
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    gap:10px;
    transition:.25s;
}

.media-item:hover{
    transform:translateY(-4px);
    border-color:#e7b84b55;
}

.media-icon{
    font-size:35px;
}


/* HISTORY / CONTACT */

.info-box{
    background:linear-gradient(145deg,#111722,#0c1018);
    border:1px solid var(--border);
    border-radius:22px;
    padding:30px;
    line-height:2.1;
    color:#c8cdd7;
}

.info-box ul{
    padding-right:25px;
    margin-top:15px;
}

.info-box li{
    margin:7px 0;
}
